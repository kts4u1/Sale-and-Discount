# 매일 한국소비자원 참가격 자료를 받아 사이트(GitHub Pages)를 다시 만든다.
# (학원 앱 kts4u1/Academy 의 update-data.yml 과 같은 방식)
#
# 처음 한 번만 설정:
#   1) Settings → Pages → Build and deployment → Source: GitHub Actions
#   2) Settings → Secrets and variables → Actions → New repository secret
#      이름: DATA_GO_KR_KEY / 값: 공공데이터포털 인증키 (키를 코드나 채팅에 붙여 넣지 마세요)
#      공공데이터포털 인증키는 계정마다 하나라서 학원 앱에 넣은 키와 같은 값입니다.
#      단, "한국소비자원_생필품 가격 정보" 에 활용신청이 되어 있어야 합니다.
#      (선택) KAKAO_REST_API_KEY : 좌표가 없는 판매점의 주소 → 좌표 변환이 빨라집니다
#   3) Actions → "참가격 데이터 매일 업데이트" → Run workflow
#
# - 이미 받은 조사일(매주 금요일)이면 다시 받지 않아 매일 돌려도 API 호출은 몇 번뿐이다.
# - 받은 원자료(.kca-raw)를 Actions 캐시에 보관하고, API 가 실패하면 보관본으로 다시 만든다.
# - 둘 다 안 되면 배포하지 않으므로 지난번 사이트(데이터)가 그대로 남고, 실행은 실패로 표시돼 알림이 간다.
name: 참가격 데이터 매일 업데이트

on:
  schedule:
    # 매일 06:17 (한국 시간) = 전날 21:17 UTC. 정각은 GitHub 예약 실행이 몰려 늦어지기 쉬워 피한다.
    - cron: '17 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '이미 받은 조사일이어도 다시 받기'
        type: boolean
        default: false
  push:
    branches: [claude/pensive-turing-vbvjkc]

permissions:
  contents: read
  pages: write
  id-token: write
  # 공개 저장소의 예약 실행은 60일 동안 활동이 없으면 꺼지므로 매번 다시 켜 둔다
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      pages: ${{ steps.pages.outputs.enabled }}
      data: ${{ steps.result.outputs.data }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 보관한 원자료 불러오기
        uses: actions/cache/restore@v4
        with:
          path: .kca-raw
          key: kca-raw-${{ github.run_id }}
          restore-keys: kca-raw-

      - name: 참가격 자료 받기
        id: kca
        continue-on-error: true
        # 처음이나 매주 한 번은 전국 체인 매장 위치도 받아서 오래 걸릴 수 있다
        timeout-minutes: 60
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: npm run data:update -- ${{ inputs.force && '--force' || '' }}

      # API 가 실패하면(서버 장애·호출 한도 초과 등) 보관해 둔 원자료로 다시 만든다
      - name: 보관한 원자료로 다시 만들기
        id: offline
        if: steps.kca.outcome == 'failure' && hashFiles('.kca-raw/lists.json') != ''
        continue-on-error: true
        run: npm run data:update -- --offline

      - name: 결과 정리
        id: result
        run: |
          if [ "${{ steps.kca.outcome }}" = "success" ]; then
            echo "data=${{ steps.kca.outputs.kca }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.offline.outcome }}" = "success" ]; then
            echo "data=offline" >> "$GITHUB_OUTPUT"
            echo "::warning::참가격 API 로 받지 못해 보관해 둔 원자료로 만들었습니다."
          else
            echo "data=failed" >> "$GITHUB_OUTPUT"
            echo "::error::참가격 자료를 만들지 못했습니다. 지난번 사이트를 그대로 둡니다."
          fi

      # 새로 받은 원자료를 보관한다 (Actions 캐시는 7일 동안 안 쓰면 지워지므로 매번 다시 저장)
      - name: 원자료 보관
        if: steps.result.outputs.data != 'failed' && hashFiles('.kca-raw/lists.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .kca-raw
          key: kca-raw-${{ github.run_id }}

      - run: npm test

      - name: 사이트 만들기 (서버 없이 동작하는 정적 빌드)
        run: npm run build:static

      # Pages 를 아직 켜지 않았으면 배포만 건너뛴다 (빌드·테스트는 그대로 확인)
      - name: Pages 설정 확인
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.result.outputs.data }}" = "failed" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null)" = "workflow" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages 가 GitHub Actions 배포로 설정되어 있지 않아 배포를 건너뜁니다. Settings → Pages → Source: GitHub Actions"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 예약 실행 켜 두기
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-data.yml/enable"

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: client/dist

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 자료를 만들지 못했으면 실행을 실패로 표시해 알림이 가게 한다
  data-alert:
    needs: build
    if: always() && needs.build.outputs.data == 'failed'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "### 참가격 자료를 만들지 못해 배포하지 않았습니다 (지난번 사이트가 그대로 남아 있음)" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::인증키(DATA_GO_KR_KEY), 공공데이터포털 활용신청 상태, 호출 한도를 확인하세요."
          exit 1
